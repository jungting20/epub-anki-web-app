name: CI and GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install test browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log("CHROME_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"

      - name: Build application
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and browser tests
        run: npm test

  publish:
    name: Build and publish image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image-name: ${{ steps.image.outputs.name }}
      image-digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published image: `%s:%s`\n\n' "$IMAGE_NAME" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'GitOps image reference: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  update-gitops:
    name: Update GitOps image
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check GitOps token
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::error::Add the GITOPS_TOKEN Actions secret with Contents read/write access to the GitOps repository."
            exit 1
          fi

      - name: Checkout application scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jungting20/epub-anki-gitops
          ref: main
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          # Persist this repository's token so git push uses it; checkout cleans it up.
          persist-credentials: true

      - name: Install YAML tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/gitops-venv"
          "$RUNNER_TEMP/gitops-venv/bin/pip" install PyYAML==6.0.2

      - name: Update image and push
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.publish.outputs.image-name }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$latest_sha" != "$GITHUB_SHA" ]; then
              echo 'A newer main commit exists; skipping this image update.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # Reapply to the latest GitOps commit if a concurrent push is rejected.
            git fetch origin main
            git checkout --detach origin/main
            "$RUNNER_TEMP/gitops-venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/update_gitops_image.py" \
              kustomization.yaml "$IMAGE_NAME" "$IMAGE_DIGEST"

            if git diff --quiet -- kustomization.yaml; then
              echo 'GitOps already references this image.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            git add kustomization.yaml
            git commit -m "앱 이미지 버전 갱신: $GITHUB_SHA"
            if git push origin HEAD:main; then
              printf 'GitOps updated: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done

          echo '::error::GitOps push failed after three attempts. Check token permissions and branch protection.'
          exit 1
