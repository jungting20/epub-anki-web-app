apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: epub-reader-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  # Select a block-backed StorageClass, not NFS; defaults to the cluster's class.
  resources:
    requests:
      storage: 5Gi
